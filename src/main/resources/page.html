<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skalbyklos rezervacijos</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #243247; background: #f6f8fb; }
    h1 { font-size: 1.7rem; }
    h2 { font-size: 1.2rem; margin-top: 0; }
    section { background: white; border: 1px solid #dfe5ed; border-radius: 12px; padding: 1.25rem; margin: 1rem 0; }
    label { display: block; margin: .75rem 0; font-weight: 600; }
    fieldset { border: 0; padding: 0; margin: .75rem 0; }
    legend { font-weight: 600; }
    .time-select { display: flex; align-items: end; gap: .5rem; }
    .time-select label { margin: 0; }
    .time-select span { padding-bottom: .6rem; font-weight: 600; }
    input, select, button { font: inherit; padding: .55rem .7rem; border-radius: 7px; }
    input, select { display: block; box-sizing: border-box; max-width: 100%; border: 1px solid #aeb9c7; margin-top: .25rem; font-weight: 400; }
    button { border: 1px solid #2458a6; background: #2458a6; color: white; cursor: pointer; }
    button:hover { background: #1c4789; }
    button.secondary { background: white; color: #2458a6; }
    button.secondary:hover { background: #edf4ff; }
    .account-bar, .reservation { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .account-bar p { margin: 0; }
    .reservation-list { display: grid; gap: .75rem; }
    .reservation { padding: .8rem 1rem; background: #f6f8fb; border-radius: 8px; }
    .reservation small { color: #627184; }
    .times { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; list-style: none; }
    .times li { padding: .25rem .6rem; border-radius: 6px; background: #edf4ff; }
    .message { background: #e8f5eb; padding: .7rem; border-radius: 7px; }
    .error { background: #fff0ee; color: #8a2430; padding: .7rem; border-radius: 7px; }
    .home-link { color: inherit; text-decoration: none; }
    .home-link:hover { text-decoration: underline; }
    .api { margin: 1.5rem 0; color: #627184; }
    @media (max-width: 520px) { .reservation, .account-bar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <h1><a class="home-link" href="/">Bendrabučio skalbykla</a></h1>
  {{body}}
</body>
</html>
